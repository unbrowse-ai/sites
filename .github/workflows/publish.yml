# Daily: rebuild every site pack from Unbrowse's live registry, commit them here, and publish where policy allows.
# The official MCP Registry gets one templated entry (io.github.unbrowse-ai/sites) through GitHub OIDC.
# Smithery skills (per site, capped by MAX_NEW) and ClawHub (curated.txt only) run only when their secret is set.
name: publish
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
    inputs:
      limit: { description: "Packs to build", default: "150" }
permissions:
  contents: write
  id-token: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: MCP Registry publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher login github-oidc
      - name: Optional publishers
        env: { SMITHERY_API_KEY: "${{ secrets.SMITHERY_API_KEY }}", CLAWHUB_TOKEN: "${{ secrets.CLAWHUB_TOKEN }}" }
        run: |
          TO=repo,mcp-registry
          if [ -n "$SMITHERY_API_KEY" ]; then npm i -g @smithery/cli >/dev/null && TO="$TO,smithery"; fi
          if [ -n "$CLAWHUB_TOKEN" ]; then npm i -g clawhub >/dev/null && clawhub login --token "$CLAWHUB_TOKEN" --no-browser && TO="$TO,clawhub"; fi
          echo "TO=$TO" >> "$GITHUB_ENV"
      - name: Build and publish
        env:
          SITES_REPO: ${{ github.workspace }}
          UNBROWSE_API_KEY: ${{ secrets.UNBROWSE_API_KEY }}
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          MAX_NEW: "10"
        run: |
          git config user.name "unbrowse-bot" && git config user.email "bot@unbrowse.ai"
          CURATED=$(grep -v '^#' curated.txt | paste -sd, -)
          node --experimental-strip-types pipeline/publish.ts --limit "${{ inputs.limit || '150' }}" --verify --out "$RUNNER_TEMP/packs" --to "$TO" ${CURATED:+--curated "$CURATED"}
